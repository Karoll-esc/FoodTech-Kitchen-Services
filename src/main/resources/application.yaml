spring:
  application:
    name: foodtech-kitchen-service
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          audiences: ${AUTH0_AUDIENCE}

# Auth0 Configuration
# These values should be provided via environment variables or application-local.yaml
# Never commit actual Auth0 credentials to version control
auth0:
  domain: ${AUTH0_DOMAIN:your-tenant.us.auth0.com}
  audience: ${AUTH0_AUDIENCE:https://api.foodtech-kitchen.com}

# AWS Configuration
# These values should be provided via environment variables or application-local.yaml
# Never commit actual AWS credentials to version control
aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID:your-access-key-id}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY:your-secret-access-key}
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:foodtech-product-images}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodtech}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Use 'validate' in production
